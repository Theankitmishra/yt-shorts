services:
  shorts-studio:
    build: .
    container_name: shorts-studio
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./data:/home/user/app/data
      - ./outputs:/home/user/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7860/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
